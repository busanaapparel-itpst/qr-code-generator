<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QR Code dari Excel</title>
<meta name="theme-color" content="#0f6b5c">
<meta name="description" content="Buat PDF A4 berisi QR code dari file Excel.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1d2421;--mute:#66706b;--line:#d9ded9;--accent:#0f6b5c;--accent-ink:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#141a18;--card:#1c2421;--ink:#e8eeea;--mute:#98a39d;--line:#32403b;--accent:#4cc3a8;--accent-ink:#0b1512}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:980px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:1.6rem;margin:0 0 4px}
.sub{margin:0 0 14px;color:var(--mute)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px;margin-bottom:18px}
.drop{border:2px dashed var(--line);border-radius:10px;padding:26px;text-align:center;cursor:pointer;color:var(--mute)}
.drop.over,.drop:hover{border-color:var(--accent);color:var(--ink)}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
button{font:inherit;padding:9px 16px;border-radius:7px;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);cursor:pointer}
button.alt{background:transparent;color:var(--accent)}
button:disabled{opacity:.45;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.msg{color:var(--mute);margin:8px 0 0;font-size:.9rem}
.err{color:#b3261e}
.hide{display:none}
.pages{display:flex;flex-wrap:wrap;gap:18px}
.page{container-type:inline-size;width:100%;max-width:440px;aspect-ratio:210/297;background:#fff;color:#000;padding:3.8%;box-shadow:0 1px 6px rgba(0,0,0,.25)}
.sheet{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(5,1fr);height:100%}
.cell{border:1px dashed #999;display:flex;align-items:center;gap:3cqw;padding:0 1.6cqw;font-size:2cqw;line-height:1.2;overflow:hidden}
.cell svg{flex:0 0 38%;width:38%;height:auto;background:#fff}
.cell small{display:block;color:#6e6e6e;font-size:1.6cqw}
.cell b{display:block;font-size:2.1cqw;margin-bottom:.8cqw;word-break:break-all}
</style>
</head>
<body>
<main>
  <h1>QR Code dari Excel</h1>
  <p class="sub">Hasil berupa PDF A4, 10 QR code per halaman. QR berisi data kolom Status.</p>
  <p class="sub"><button class="alt hide" id="install">Pasang sebagai aplikasi</button> <span id="offline" class="hide">Mode offline aktif.</span></p>

  <div class="panel">
    <div class="drop" id="drop" tabindex="0" role="button" aria-label="Pilih file Excel">
      Seret file ke sini atau klik untuk memilih<br><small>.xlsx, .xls, atau .csv</small>
    </div>
    <input type="file" id="file" accept=".xlsx,.xls,.csv" class="hide">
    <p class="msg" id="info">Belum ada file.</p>
  </div>

  <div class="panel hide" id="actions">
    <div class="row">
      <button id="pdf">Unduh PDF</button>
      <button class="alt" id="print">Cetak</button>
    </div>
    <p class="msg" id="count"></p>
  </div>

  <div class="pages" id="pages"></div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const $ = id => document.getElementById(id);
const PER_PAGE = 10;
let items = [];

function info(t, err){ const e=$('info'); e.textContent=t; e.className='msg'+(err?' err':''); }
function esc(s){ return String(s).replace(/[&<>"]/g, m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])); }

// Cari kolom berdasarkan nama header; jika tidak ada, pakai posisi kolom (A=0, B=1, ...)
function findKey(keys, name, idx){
  const n = s => s.toLowerCase().replace(/\s+/g,'');
  return keys.find(k => n(k) === n(name)) ?? keys[idx];
}

function makeQR(text){ const q = qrcode(0,'M'); q.addData(text); q.make(); return q; }

function qrSVG(text){
  const q = makeQR(text), n = q.getModuleCount();
  let d = '';
  for(let r=0;r<n;r++) for(let c=0;c<n;c++) if(q.isDark(r,c)) d += `M${c+1} ${r+1}h1v1h-1z`;
  return `<svg viewBox="0 0 ${n+2} ${n+2}" shape-rendering="crispEdges"><path d="${d}"/></svg>`;
}

async function readFile(f){
  try{
    const wb = XLSX.read(await f.arrayBuffer(), {type:'array'});
    const ws = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, {defval:'', raw:false});
    if(!rows.length){ info('File kosong atau tidak ada baris data.', true); return; }
    const keys = Object.keys(rows[0]);
    const k = {
      pocf: findKey(keys,'POCF',0),
      date: findKey(keys,'BC Date',6),
      status: findKey(keys,'Status',9),
      color: findKey(keys,'Color Description',3),
      roll: findKey(keys,'Roll Number',4)
    };
    if(!k.status){ info('Kolom Status tidak ditemukan.', true); return; }
    let skipped = 0; items = [];
    for(const r of rows){
      const status = String(r[k.status] ?? '').trim();
      if(!status){ skipped++; continue; }
      items.push({
        pocf: String(r[k.pocf] ?? '').trim(),
        date: String(r[k.date] ?? '').trim(),
        color: String(r[k.color] ?? '').trim(),
        roll: String(r[k.roll] ?? '').trim(),
        status
      });
    }
    info(`${f.name}: ${rows.length} baris dibaca dari sheet "${wb.SheetNames[0]}".`);
    $('count').textContent = `${items.length} QR code, ${Math.ceil(items.length/PER_PAGE)} halaman A4` + (skipped ? `, ${skipped} baris dilewati karena Status kosong.` : '.') + ' Pratinjau menampilkan 2 halaman pertama.';
    $('actions').classList.toggle('hide', !items.length);
    renderPreview();
  }catch(e){ info('File tidak bisa dibaca. Pastikan formatnya .xlsx, .xls, atau .csv.', true); }
}

function renderPreview(){
  const wrap = $('pages'); wrap.innerHTML = '';
  const pages = Math.min(2, Math.ceil(items.length/PER_PAGE));
  for(let p=0;p<pages;p++){
    const cells = items.slice(p*PER_PAGE, p*PER_PAGE+PER_PAGE).map(it => `
      <div class="cell">${qrSVG(it.status)}
        <div><small>POCF</small><b>${esc(it.pocf)}</b>
        <small>Roll Number</small><b>${esc(it.roll)}</b>
        <small>BC Date</small><b>${esc(it.date)}</b>
        <small>Status</small><b>${esc(it.status)}</b>
        <small>Color Description</small><b>${esc(it.color)}</b></div>
      </div>`).join('');
    wrap.insertAdjacentHTML('beforeend', `<div class="page"><div class="sheet">${cells}</div></div>`);
  }
}

function buildPDF(){
  const {jsPDF} = window.jspdf;
  const doc = new jsPDF({unit:'mm', format:'a4'});
  const M = 8, CW = (210-2*M)/2, CH = (297-2*M)/5, QS = 40;
  const total = Math.ceil(items.length/PER_PAGE);

  items.forEach((it, i) => {
    if(i > 0 && i % PER_PAGE === 0) doc.addPage();
    const pos = i % PER_PAGE, x = M + (pos%2)*CW, y = M + Math.floor(pos/2)*CH;

    doc.setDrawColor(150); doc.setLineWidth(0.2);
    doc.setLineDashPattern([1.5,1.5], 0); doc.rect(x, y, CW, CH); doc.setLineDashPattern([], 0);

    // QR (vektor)
    const q = makeQR(it.status), n = q.getModuleCount(), mod = QS/(n+2);
    const qx = x+4, qy = y+(CH-QS)/2;
    doc.setFillColor(0,0,0);
    for(let r=0;r<n;r++) for(let c=0;c<n;c++)
      if(q.isDark(r,c)) doc.rect(qx+(c+1)*mod, qy+(r+1)*mod, mod+0.02, mod+0.02, 'F');

    // Teks
    const tx = x+QS+8, tw = CW-QS-12;
    doc.setFont('helvetica','bold'); doc.setFontSize(9);
    const wrap = (text, maxLines) => {
      const out = []; let line = '';
      for(const word of String(text || '-').split(/\s+/)){
        let w = word;
        while(doc.getTextWidth(w) > tw){            // pecah kata yang terlalu panjang
          let i = w.length; while(i > 1 && doc.getTextWidth(w.slice(0,i)) > tw) i--;
          if(line){ out.push(line); line = ''; }
          out.push(w.slice(0,i)); w = w.slice(i);
        }
        const t = line ? line+' '+w : w;
        if(doc.getTextWidth(t) <= tw) line = t; else { out.push(line); line = w; }
      }
      if(line) out.push(line);
      if(out.length > maxLines){ const r = out.slice(0,maxLines); r[maxLines-1] = r[maxLines-1].replace(/.{0,3}$/,'...'); return r; }
      return out;
    };
    const fields = [
      ['POCF', wrap(it.pocf,1)],
      ['Roll Number', wrap(it.roll,1)],
      ['BC Date', wrap(it.date,1)],
      ['Status', wrap(it.status,2)],
      ['Color Description', wrap(it.color,2)]
    ];
    const LBL = 2.9, LH = 3.8, GAP = 1.9;
    const content = fields.reduce((h,f) => h + LBL + f[1].length*LH + GAP, 0) - GAP;
    let ty = y + (CH-content)/2 + 2.2;
    for(const [label, lines] of fields){
      doc.setFont('helvetica','normal'); doc.setFontSize(6.5); doc.setTextColor(110);
      doc.text(label, tx, ty); ty += LBL;
      doc.setFont('helvetica','bold'); doc.setFontSize(9); doc.setTextColor(0);
      doc.text(lines, tx, ty + 0.6); ty += lines.length*LH + GAP;
    }
  });

  for(let p=1;p<=total;p++){
    doc.setPage(p); doc.setFont('helvetica','normal'); doc.setFontSize(7); doc.setTextColor(130);
    doc.text(`Halaman ${p} / ${total}`, 105, 294, {align:'center'});
  }
  return doc;
}

$('pdf').onclick = () => {
  const b = $('pdf'); b.disabled = true; b.textContent = 'Menyusun PDF...';
  setTimeout(() => { try{ buildPDF().save('qrcode.pdf'); } finally { b.disabled = false; b.textContent = 'Unduh PDF'; } }, 30);
};
$('print').onclick = () => { try{ buildPDF().output('dataurlnewwindow'); }catch(e){ window.print(); } };

const drop = $('drop'), fi = $('file');
drop.onclick = () => fi.click();
drop.onkeydown = e => { if(e.key==='Enter'||e.key===' '){ e.preventDefault(); fi.click(); } };
fi.onchange = () => fi.files[0] && readFile(fi.files[0]);
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => { e.preventDefault(); drop.classList.remove('over'); e.dataTransfer.files[0] && readFile(e.dataTransfer.files[0]); };

// --- PWA ---
if('serviceWorker' in navigator){
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
let deferred = null;
addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferred = e; $('install').classList.remove('hide'); });
$('install').onclick = async () => { if(!deferred) return; deferred.prompt(); await deferred.userChoice; deferred = null; $('install').classList.add('hide'); };
addEventListener('appinstalled', () => $('install').classList.add('hide'));
const syncOnline = () => $('offline').classList.toggle('hide', navigator.onLine);
addEventListener('online', syncOnline); addEventListener('offline', syncOnline); syncOnline();
</script>
</body>
</html>
